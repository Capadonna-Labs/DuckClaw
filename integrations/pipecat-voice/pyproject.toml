[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duckclaw-pipecat-voice"
version = "0.1.0"
description = "DuckClaw Pipecat realtime voice — WebRTC transport, graph bridge to gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
realtime = [
    "pipecat-ai[webrtc,deepgram,cartesia,silero]>=0.0.80",
    "pipecat-ai-small-webrtc-prebuilt>=2.0.0",
    "loguru>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
