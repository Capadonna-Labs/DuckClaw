[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckclaw-telegram-mcp"
version = "0.1.0"
description = "MCP servers for Telegram: Bot API (stdio) and controlled user-account access (Telethon, streamable HTTP)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8.0",
    "duckclaw-shared",
    "telethon>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
duckclaw-shared = { path = "../../shared", editable = true }
