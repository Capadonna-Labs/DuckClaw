# Plantilla interna DuckClaw — NO es un agente para usar en producción.
# Al crear un agente nuevo, la consola copia esta carpeta como punto de partida.
# Las herramientas base (SQL, RAG, sandbox) se fusionan automáticamente vía framework_tool_pack.
name: Plantilla base DuckClaw
id: default
schema_name: agent_worker
topology: general
internal_scaffold: true
read_only: false
tool_profile: general
description: >
  Scaffold interno del producto. No lo asignes a proyectos ni lo uses en Playground.
  Crea un agente propio (p. ej. aws-expert-agent) desde Agentes → Nuevo.

llm:
  required: true
  temperature: 0.3

skills: []

# Progressive disclosure de tools (opcional). Default: catálogo YAML del framework.
# tool_surface:
#   runtime_packs:
#     enabled: true
#     orphan_policy: include
#     max_bound_tools: 28
#     disabled_packs: []
#     extra_always: [knowledge]
#     pack_overrides:
#       research:
#         activation_signals: [wikipedia, internet]

# Skills opcionales (añadir en agentes reales, no en esta plantilla):
#   - research: { tavily_enabled: true }
#   - comfyui: { enabled: true, template: comfy_default }
#   - fal: { enabled: false }
