# Project N.O.M.A.D. (offline-first knowledge server) as an OPTIONAL companion of DuckClaw. Not part of the default stack: nothing here starts unless you run
#   uv run duckops nomad up
#
# Adapted from the upstream template https://github.com/Crosstalk-Solutions/project-nomad/blob/main/install/management_compose.yaml
# (Copyright Crosstalk Solutions, Apache License 2.0). Changes from upstream, on purpose:
#   - the image is pinned (NOMAD_VERSION) instead of `latest` + `pull_policy: always`;
#   - every secret is required and generated by `duckops nomad up` (upstream ships placeholder values);
#   - ports are published on 127.0.0.1 by default (NOMAD_BIND), not on every interface;
#   - data lives under NOMAD_DATA_DIR (default ~/.duckclaw/project-nomad/data), not /opt;
#   - the Dozzle log viewer and the self-updater sidecar are left out: each mounts the host Docker socket again. Update by changing NOMAD_VERSION.
#
# SECURITY: the admin container mounts /var/run/docker.sock (upstream needs it to start and stop the apps it manages: Kiwix, Ollama, ...). Anyone who controls NOMAD's
# admin panel can therefore control the host's Docker, which is root-equivalent. Keep it on loopback or a private network, run it on a machine you can afford to
# dedicate to it, and never expose port 8080 to the internet.
name: project-nomad

services:
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:${NOMAD_VERSION:-v1.35.1}
    pull_policy: missing
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOMAD_BIND:-127.0.0.1}:${NOMAD_PORT:-8080}:8080"
    volumes:
      - ${NOMAD_DATA_DIR:?run duckops nomad up}/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      - NOMAD_STORAGE_PATH=${NOMAD_DATA_DIR}/storage
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=${NOMAD_APP_KEY:?run duckops nomad up}
      - HOST=0.0.0.0
      - URL=${NOMAD_URL:-http://127.0.0.1:8080}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${NOMAD_DB_PASSWORD:?run duckops nomad up}
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_COMPRESSION=false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NOMAD_DB_ROOT_PASSWORD:?run duckops nomad up}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=${NOMAD_DB_PASSWORD:?run duckops nomad up}
    volumes:
      - ${NOMAD_DATA_DIR}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${NOMAD_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nomad-update-shared:
