[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duckclaw-sensory-node"
version = "0.1.0"
description = "Edge sensory inference: STT (mlx-whisper) and TTS (OmniVoice) on Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin'",
    "mlx-audio>=0.2.0; sys_platform == 'darwin'",
    "mlx>=0.20.0; sys_platform == 'darwin'",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.25.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
