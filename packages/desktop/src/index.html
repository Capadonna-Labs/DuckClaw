<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DuckClaw</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #c8d0dc; font-family: system-ui, sans-serif; }
      .wrap { display: grid; place-items: center; height: 100%; text-align: center; padding: 2rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>Starting DuckClaw…</p>
      <p id="status">Backend booting</p>
    </div>
    <script>
      const gateway = "http://127.0.0.1:8000";
      const admin = "http://127.0.0.1:3000";
      const loginUrl = admin + "/login";
      const statusEl = document.getElementById("status");

      async function backendReady() {
        try {
          const r = await fetch(gateway + "/health");
          return r.ok;
        } catch (_) {
          return false;
        }
      }

      async function adminReady() {
        try {
          const r = await fetch(loginUrl, { redirect: "manual" });
          return r.status > 0 && r.status < 500;
        } catch (_) {
          return false;
        }
      }

      async function waitReady() {
        for (let i = 0; i < 180; i++) {
          const backend = await backendReady();
          const ui = backend ? await adminReady() : false;
          if (backend && ui) {
            window.location.replace(loginUrl);
            return;
          }
          if (!backend) {
            statusEl.textContent = "Waiting for backend (" + (i + 1) + "/180)…";
          } else {
            statusEl.textContent = "Waiting for admin UI (" + (i + 1) + "/180)…";
          }
          await new Promise((r) => setTimeout(r, 1000));
        }
        statusEl.textContent = "Services did not start (backend :8000, admin :3000). Close PM2 gateway if port 8000 is busy, then retry.";
      }
      waitReady();
    </script>
  </body>
</html>
