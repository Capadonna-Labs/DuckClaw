# Plantilla interna DuckClaw — NO es un agente para usar en producción.
# Al crear un agente nuevo, la consola copia esta carpeta como punto de partida.
# Las herramientas base (SQL, RAG, sandbox) se fusionan automáticamente vía framework_tool_pack.
name: Plantilla base DuckClaw
id: default
schema_name: agent_worker
topology: general
internal_scaffold: true
read_only: false
tool_profile: general
description: >
  Scaffold interno del producto. No lo asignes a proyectos ni lo uses en Playground.
  Crea un agente propio (p. ej. aws-expert-agent) desde Agentes → Nuevo.

llm:
  required: true
  temperature: 0.3

skills: []

# Progressive disclosure de tools (N agentes × N MCP). Default: catálogo YAML del framework.
# tool_surface:
#   runtime_packs:
#     enabled: true
#     orphan_policy: exclude          # SOTA: sin tools huérfanas en el bind
#     max_bound_tools: 16
#     disabled_packs: []
#     extra_always: []                # p.ej. [knowledge] si el agente es solo RAG
#     pack_overrides: {}
#     extra_packs: []                 # packs custom del tenant
# MCP: packs dinámicos mcp_{connector}; unlock 'mcp' = todos; 'mcp_github' = fino.
#   - github: {}  # tools salen como mcp__github__* → pack mcp_github
# tool_surface:
#   harness:
#     approval_mode: suggest          # auto | suggest | never (destructive)
#     max_failures_per_tool: 2        # circuit breaker por tool/turno
#     max_tool_result_chars: 12000    # tope de tokens hacia el LLM

# Skills opcionales (añadir en agentes reales, no en esta plantilla):
#   - research: { tavily_enabled: true }
#   - comfyui: { enabled: true, template: comfy_default }
#   - fal: { enabled: false }
# browser_sandbox: true  # solo si necesitas navegador + VNC
