# Catálogo declarativo de packs de tools (N agentes × N MCP).
# Override por worker: manifest → tool_surface.runtime_packs
#
# Buenas prácticas (Anthropic Tool Search / OpenAI <20 / Gemini 10–20):
# - always-on pequeño (core)
# - MCP y dominios bajo demanda (señales / unlock / sticky)
# - orphan_policy: exclude → toda tool debe pertenecer a un pack
# - Namespacing MCP: mcp__{connector}__{tool}

version: 1
orphan_policy: exclude
max_bound_tools: 16

packs:
  - id: core
    always: true
    description: "Surface mínima: contexto, SQL lectura y discovery de packs."
    members:
      exact:
        - get_current_time
        - get_project_context
        - read_sql
        - inspect_schema
        - list_tool_packs
        - unlock_tool_pack
      prefixes: []
    activation_signals: []

  - id: mcp
    always: false
    description: >
      Umbrella MCP: unlock_tool_pack('mcp') activa todos los conectores del worker.
      La membresía real es dinámica por conector (mcp_github, mcp_notion, …).
    members:
      exact: []
      prefixes: []
    activation_signals: []

  - id: knowledge
    always: false
    description: "RAG indexado + lectura de disco bajo raíces permitidas."
    members:
      exact:
        - search_project_knowledge
        - list_project_knowledge
        - read_project_knowledge
        - extract_document_text
        - list_disk_roots
        - list_disk_folder
        - read_disk_text
      prefixes: []
    activation_signals:
      - conocimiento
      - knowledge
      - rag
      - vault
      - carpeta
      - carpetas
      - disco
      - documento
      - documentos
      - indexad
      - buscar en
      - lee el archivo
      - leer archivo
      - allowed_roots

  - id: reports
    always: false
    description: "Report Engine (plantillas Word / instancias / render)."
    members:
      exact:
        - create_blank_document
        - get_report_status
        - generate_report_docx_from_markdown
        - append_images_to_report
      prefixes:
        - register_report_
        - create_report_
        - list_report_
        - patch_report_
        - render_report_
        - resolve_report_
        - delete_report_
        - inspect_report_
    activation_signals:
      - informe
      - report engine
      - plantilla word
      - .docx
      - docx
      - secciones del informe
      - render_report
      - patch_report
      - informe mensual

  - id: docs_output
    always: false
    description: "Escritura de archivos en OUTPUT y conversión PDF ad-hoc."
    members:
      exact:
        - write_output_document
        - delete_output_document
        - render_docx_template
        - export_docx_to_pdf
        - publish_custom_report
        - update_custom_report_title
        - read_llm_usage_summary
      prefixes: []
    activation_signals:
      - escribe un archivo
      - escribir archivo
      - output/
      - markdown en output
      - exporta a pdf
      - exportar a pdf
      - custom_report
      - uso de tokens
      - llm_usage

  - id: research
    always: false
    description: "Búsqueda web y Wikipedia offline (Kiwix)."
    members:
      exact:
        - web_search
        - tavily_search
      prefixes:
        - kiwix_
        - research_
    activation_signals:
      - wikipedia
      - kiwix
      - busca en internet
      - buscar en internet
      - web search
      - tavily
      - noticias
      - online

  - id: prompt_meta
    always: false
    description: "Actualización del system prompt del worker."
    members:
      exact: []
      prefixes:
        - update_worker_system_prompt
        - update_system_prompt
        - update_my_system_prompt
        - propose_system_prompt
    activation_signals:
      - system prompt
      - cambia el prompt
      - actualizar prompt
      - actualiza el prompt
      - instrucciones del agente

  - id: visual
    always: false
    description: "Generación de imágenes / video (Comfy, Fal, etc.)."
    members:
      exact: []
      prefixes:
        - generate_visual
        - comfyui_
        - fal_
        - higgsfield_
    activation_signals:
      - genera una imagen
      - generar imagen
      - comfyui
      - imagen con ia
      - video con ia

  - id: sandbox
    always: false
    description: "Ejecución aislada (código / browser). También gated por tool_surface_policy."
    members:
      exact:
        - run_sandbox
        - run_browser_sandbox
        - get_browser_session_url
        - execute_sandbox_script
      prefixes: []
    activation_signals:
      - sandbox
      - ejecuta código
      - ejecutar código
      - run_sandbox
      - playwright
      - navegador

  - id: integrations
    always: false
    description: "Skills de integración no-MCP (reddit, trends, weather, etc.)."
    members:
      exact: []
      prefixes:
        - reddit_
        - google_trends_
        - openweather_
        - youtube_
        - tailscale_
        - slm_eval_
    activation_signals:
      - reddit
      - youtube
      - clima
      - weather
      - trends
      - tailscale
