  # ═══════════════════════════════════════════
  # Ingeniería inversa
  # ═══════════════════════════════════════════

  # REA (https://github.com/morluto/rea, MIT). Binarios (Hopper/Ghidra/IDA), Electron/JS, .NET, APK, web, firmware.
  # Versión FIJA a propósito: publica casi a diario (6.x en 5 días) y arrastra playwright/node-pty. Subir a mano.
  # OJO: read_only de DuckClaw solo filtra nombres create_/delete_/update_/push_/write_/remove_/merge_; la captura
  # en runtime de REA corre con los permisos del usuario. No concederlo a ningún worker por defecto.
  rea:
    profile: stdio_npx_ro
    display_name: REA (reverse engineering)
    launch_args: ["-y", "rea-agents@6.4.0", "mcp"]
    metadata:
      install: npx -y rea-agents@6.4.0 mcp
      manifest_skill_id: rea
      admin_label: REA · ingeniería inversa (local stdio, versión fija)
      docs_url: https://github.com/morluto/rea
      env_vars: [GHIDRA_INSTALL_DIR, JAVA_HOME]

  # Alpaca (broker MCP oficial, stdio · uvx, versión fija). Cada usuario carga SUS claves en
  # Integraciones → Cuentas de bróker; el puente las inyecta por tenant y nunca usa las del servidor.
  # read_only de DuckClaw no filtra place_*/cancel_*/close_*: esas tools pasan por confirmación
  # humana (metadata.confirm_tools → /approve <id> · /reject <id>).
  alpaca:
    profile: stdio_uvx_rw
    display_name: Alpaca (paper)
    launch_args: ["alpaca-mcp-server==2.4.0", "serve"]
    launch_env:
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TOOLSETS: account,trading,assets,stock-data,news
    metadata:
      manifest_skill_id: alpaca
      admin_label: Alpaca paper (local stdio · uvx) · claves en Integraciones
      docs_url: https://github.com/alpacahq/alpaca-mcp-server
      install: uvx alpaca-mcp-server==2.4.0 serve
      integration_env:
        ALPACA_API_KEY: alpaca
        ALPACA_SECRET_KEY: alpaca_secret
      confirm_tools: &alpaca_confirm
        - place_*
        - replace_order_by_id
        - cancel_*
        - close_*
        - exercise_*
        - do_not_exercise_*
        - update_account_config
        - create_locate

  alpaca_live:
    profile: stdio_uvx_rw
    display_name: Alpaca (live · dinero real)
    launch_args: ["alpaca-mcp-server==2.4.0", "serve"]
    launch_env:
      ALPACA_PAPER_TRADE: "false"
      ALPACA_TOOLSETS: account,trading,assets,stock-data,news
    metadata:
      manifest_skill_id: alpaca_live
      admin_label: Alpaca LIVE (dinero real; requiere cuenta verificada en Alpaca)
      docs_url: https://github.com/alpacahq/alpaca-mcp-server
      install: uvx alpaca-mcp-server==2.4.0 serve
      integration_env:
        ALPACA_API_KEY: alpaca_live
        ALPACA_SECRET_KEY: alpaca_live_secret
      confirm_tools: *alpaca_confirm

  # Interactive Brokers (MCP comunitario interactive-brokers-mcp, MIT · stdio · npx, versión fija).
  # Trae IB Gateway + Java, reutiliza un gateway local si ya hay uno y lo deja vivo entre llamadas.
  # Login: navegador en https://localhost:5000 (por defecto) o headless si el usuario cargó usuario y
  # contraseña en Integraciones (el 2FA se aprueba en el celular). La sesión del bróker caduca a diario.
  interactive_brokers:
    profile: stdio_npx_rw
    display_name: Interactive Brokers (paper)
    launch_args: ["-y", "interactive-brokers-mcp@1.24.1"]
    launch_env:
      IB_PAPER_TRADING: "true"
      IB_READ_ONLY_MODE: "false"
      IB_GATEWAY_PORT: "5000"
    metadata:
      manifest_skill_id: interactive_brokers
      admin_label: Interactive Brokers paper (local stdio · npx) · login en https://localhost:5000
      docs_url: https://github.com/code-rabi/interactive-brokers-mcp
      install: npx -y interactive-brokers-mcp@1.24.1
      integration_env_optional:
        IB_USERNAME: interactive_brokers_user
        IB_PASSWORD_AUTH: interactive_brokers_password
      env_when_optional_set:
        IB_HEADLESS_MODE: "true"
      confirm_tools: &interactive_brokers_confirm
        - place_*
        - modify_*
        - replace_*
        - cancel_*
        - close_*
        - confirm_*
        - reply_*

  interactive_brokers_live:
    profile: stdio_npx_rw
    display_name: Interactive Brokers (live · dinero real)
    launch_args: ["-y", "interactive-brokers-mcp@1.24.1"]
    launch_env:
      IB_PAPER_TRADING: "false"
      IB_READ_ONLY_MODE: "false"
      IB_GATEWAY_PORT: "5000"
    metadata:
      manifest_skill_id: interactive_brokers_live
      admin_label: Interactive Brokers LIVE (dinero real) · login en https://localhost:5000
      docs_url: https://github.com/code-rabi/interactive-brokers-mcp
      install: npx -y interactive-brokers-mcp@1.24.1
      integration_env_optional:
        IB_USERNAME: interactive_brokers_live_user
        IB_PASSWORD_AUTH: interactive_brokers_live_password
      env_when_optional_set:
        IB_HEADLESS_MODE: "true"
      confirm_tools: *interactive_brokers_confirm
