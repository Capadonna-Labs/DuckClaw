[package]
name = "duckclaw-desktop-docker"
version = "0.1.0"
description = "DuckClaw Full Docker launcher"
authors = ["DuckClaw"]
edition = "2021"

[lib]
name = "duckclaw_desktop_docker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
