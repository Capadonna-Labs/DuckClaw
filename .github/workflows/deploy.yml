# CI: tests on push/PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests (unit + smoke)
        timeout-minutes: 25
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run pytest tests/ -v
          -m "not integration"
          --ignore=tests/run_singleton_writer_pipeline.py
          --ignore=tests/deprecated
          --durations=25
          --timeout=120

      - name: Migrate gateway schema
        env:
          REDIS_URL: redis://localhost:6379/0
          DUCKDB_PATH: db/duckclaw.duckdb
        run: uv run duckclaw-migrate --no-seed-admin

      - name: Run singleton writer pipeline integration test with logs
        timeout-minutes: 10
        env:
          REDIS_URL: redis://localhost:6379/0
          DUCKDB_PATH: db/duckclaw.duckdb
          DUCKCLAW_DEV_MODE: "1"
          RUN_SINGLETON_PIPELINE_INTEGRATION: "1"
        run: uv run pytest tests/run_singleton_writer_pipeline.py -v -m integration --capture=no
