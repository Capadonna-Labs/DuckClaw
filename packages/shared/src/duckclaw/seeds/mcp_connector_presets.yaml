# Packaged MCP connector presets (T1 profiles).
# Override: DUCKCLAW_MCP_PRESETS_PATH or {DUCKCLAW_REPO_ROOT}/config/mcp_connector_presets.yaml

# Vacío a propósito: MCP se crea solo desde Admin (/mcp), no por migrate/boot.
default_connectors: []

defaults:
  tool_allowlist: ["*"]
  tool_denylist: []
  egress_hosts: []

profiles:
  stdio_npx_ro:
    transport: stdio
    launch_command: npx
    auth_kind: none
    read_only: true

  stdio_npx_rw:
    transport: stdio
    launch_command: npx
    auth_kind: none
    read_only: false

  stdio_uvx_ro:
    transport: stdio
    launch_command: uvx
    auth_kind: none
    read_only: true

  stdio_uvx_rw:
    transport: stdio
    launch_command: uvx
    auth_kind: none
    read_only: false

presets:
  telegram_user:
    display_name: Telegram (cuenta)
    transport: streamable_http
    endpoint_url: http://127.0.0.1:8765/mcp
    auth_kind: none
    # Reads + writes; which chats is enforced by the server's own allowlists
    # (TELEGRAM_USER_READ_ALLOW / _SEND_ALLOW), sends default to drafts.
    read_only: false
    egress_hosts: [127.0.0.1]
    metadata:
      docs_url: https://docs.telethon.dev/
      setup: "python -m duckclaw_telegram_mcp.user login; pm2 start config/ecosystem.mcp.config.cjs --only DuckClaw-Telegram-User-MCP"

  remote_http_oauth:
    display_name: Higgsfield
    transport: streamable_http
    endpoint_url: https://mcp.higgsfield.ai/mcp
    auth_kind: bearer
    read_only: false
    egress_hosts: [mcp.higgsfield.ai]
    metadata:
      oauth_pkce: true
      manifest_skill_id: higgsfield
      docs_url: https://higgsfield.ai/mcp

  notion:
    display_name: Notion
    transport: streamable_http
    endpoint_url: https://mcp.notion.com/mcp
    auth_kind: bearer
    read_only: false
    egress_hosts: [mcp.notion.com]
    metadata:
      oauth_pkce: true
      manifest_skill_id: notion
      docs_url: https://developers.notion.com/docs/mcp

  # Cursor mcpServers.nexlev.url — OAuth descubierto, sin command ni API key.
  # El grant de Admin aplica a cualquier worker, incluido youtube-analyst.
  nexlev:
    display_name: Nexlev
    transport: streamable_http
    endpoint_url: https://prod.dashboard.nexlev.io/api/mcp
    auth_kind: bearer
    read_only: false
    egress_hosts: [prod.dashboard.nexlev.io]
    metadata:
      oauth_pkce: true
      oauth_provider: mcp_dcr
      manifest_skill_id: nexlev
      admin_label: HTTP remoto · OAuth descubierto
      docs_url: https://docs.nexlev.io/docs/mcp/quickstart

  google_workspace:
    display_name: Google Workspace
    transport: streamable_http
    endpoint_url: https://workspacemcp.googleapis.com/mcp/v1
    auth_kind: bearer
    read_only: true
    tool_denylist: [search_corpus]
    egress_hosts: [workspacemcp.googleapis.com, oauth2.googleapis.com, accounts.google.com]
    metadata:
      oauth_pkce: true
      oauth_provider: google_workspace
      manifest_skill_id: google_workspace
      admin_label: HTTP remoto · OAuth PKCE
      docs_url: https://developers.google.com/workspace/guides/universal-search-mcp

  google_calendar:
    display_name: Google Calendar
    transport: streamable_http
    endpoint_url: https://calendarmcp.googleapis.com/mcp/v1
    auth_kind: bearer
    read_only: false
    egress_hosts: [calendarmcp.googleapis.com, oauth2.googleapis.com, accounts.google.com]
    metadata:
      oauth_pkce: true
      oauth_provider: google_workspace
      manifest_skill_id: google_calendar
      admin_label: HTTP remoto · OAuth PKCE (Calendar)
      docs_url: https://developers.google.com/workspace/calendar/api/guides/configure-mcp-server
      # Doc oficial Calendar MCP (Data Access) + calendar.events para create/update/delete
      google_oauth_scopes:
        - openid
        - https://www.googleapis.com/auth/calendar.calendarlist.readonly
        - https://www.googleapis.com/auth/calendar.events.freebusy
        - https://www.googleapis.com/auth/calendar.events.readonly
        - https://www.googleapis.com/auth/calendar.events

  google_gmail:
    display_name: Google Gmail
    transport: streamable_http
    endpoint_url: https://gmailmcp.googleapis.com/mcp/v1
    auth_kind: bearer
    read_only: false
    egress_hosts: [gmailmcp.googleapis.com, gmail.googleapis.com, oauth2.googleapis.com, accounts.google.com]
    metadata:
      oauth_pkce: true
      oauth_provider: google_workspace
      manifest_skill_id: google_gmail
      admin_label: HTTP remoto · OAuth PKCE (Gmail)
      docs_url: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
      # Doc oficial Gmail MCP + compose para create_draft; REST fallback si MCP tools/call niega.
      google_oauth_scopes:
        - openid
        - https://www.googleapis.com/auth/gmail.readonly
        - https://www.googleapis.com/auth/gmail.compose
        - https://www.googleapis.com/auth/gmail.modify

  google_youtube_analytics:
    display_name: YouTube Analytics
    transport: streamable_http
    endpoint_url: https://youtubeanalytics.googleapis.com/v2/reports
    auth_kind: bearer
    read_only: true
    egress_hosts: [youtubeanalytics.googleapis.com, www.googleapis.com, oauth2.googleapis.com, accounts.google.com]
    metadata:
      oauth_pkce: true
      oauth_provider: google_youtube_analytics
      manifest_skill_id: google_youtube_analytics
      admin_label: REST directo · Analytics + Data API (trending/search) · OAuth PKCE
      docs_url: https://developers.google.com/youtube/v3/docs
      # Sin MCP hosteado por Google: registra REST de Analytics (canal propio) + Data API
      # (mostPopular/search/categories) cuando OAuth está listo. youtube.readonly cubre Data API.
      google_oauth_scopes:
        - openid
        - https://www.googleapis.com/auth/youtube.readonly
        - https://www.googleapis.com/auth/yt-analytics.readonly

  google_maps:
    display_name: Google Maps
    transport: streamable_http
    endpoint_url: https://mapstools.googleapis.com/mcp
    auth_kind: bearer
    read_only: true
    egress_hosts: [mapstools.googleapis.com, oauth2.googleapis.com, accounts.google.com]
    metadata:
      oauth_pkce: true
      oauth_provider: google_workspace
      manifest_skill_id: google_maps
      admin_label: HTTP remoto · OAuth PKCE (Maps)
      docs_url: https://developers.google.com/maps/ai/grounding-lite/reference/mcp

  # Remote MCP (docs): https://docs.tavily.com/documentation/mcp
  # Auth: API key como Bearer (o ?tavilyApiKey= en URL). OAuth opcional en clientes MCP-native.
  tavily:
    display_name: Tavily
    transport: streamable_http
    endpoint_url: https://mcp.tavily.com/mcp/
    auth_kind: bearer
    read_only: true
    egress_hosts: [mcp.tavily.com]
    metadata:
      oauth_pkce: false
      manifest_skill_id: research
      integration_id: tavily
      admin_label: HTTP remoto · Bearer (Tavily API key)
      docs_url: https://docs.tavily.com/documentation/mcp

  # Remote GitHub MCP (docs):
  # https://docs.github.com/en/copilot/how-tos/provide-context/use-mcp-in-your-ide/set-up-the-github-mcp-server
  # Auth: PAT como Bearer (OAuth one-click es del host Copilot IDE; DuckClaw usa PAT).
  github:
    display_name: GitHub
    transport: streamable_http
    endpoint_url: https://api.githubcopilot.com/mcp/
    auth_kind: bearer
    read_only: false
    egress_hosts: [api.githubcopilot.com]
    metadata:
      oauth_pkce: false
      manifest_skill_id: github
      admin_label: HTTP remoto · Bearer (GitHub PAT)
      docs_url: https://docs.github.com/es/copilot/how-tos/provide-context/use-mcp-in-your-ide/set-up-the-github-mcp-server
      repo_url: https://github.com/github/github-mcp-server

  youtube_transcript:
    profile: stdio_uvx_ro
    display_name: YouTube Transcript
    launch_args:
      - "--from"
      - "git+https://github.com/jkawamoto/mcp-youtube-transcript"
      - "--with"
      - "mcp>=1.9,<2"
      - "mcp-youtube-transcript"
      - "--response-limit"
      - "15000"
    metadata:
      manifest_skill_id: youtube_transcript
      admin_label: YouTube transcript (local stdio · uvx · read-only)
      docs_url: https://github.com/jkawamoto/mcp-youtube-transcript
      install: uvx --from git+https://github.com/jkawamoto/mcp-youtube-transcript --with 'mcp>=1.9,<2' mcp-youtube-transcript
      note: Activa vía skill youtube_transcript en manifest del worker (bridge DuckClaw); no requiere conector OAuth.

  # Official Blender Lab MCP server (stdio, v1.0.3 pinned by commit). Needs Blender 5.1+ running on the SAME host with the Blender Lab add-on enabled
  # (the add-on listens on 127.0.0.1:9876); it does not work against a server without that desktop session. Experimental, outside Blender's roadmap.
  # execute_blender_code* run LLM-generated Python in Blender with no guards (Blender's own warning): denied by default, remove them from the denylist
  # in Admin only on a VM or a machine without sensitive data.
  blender:
    profile: stdio_uvx_rw
    display_name: Blender (oficial · Blender Lab)
    launch_args:
      - "--from"
      - "git+https://projects.blender.org/lab/blender_mcp.git@2cea8d566dde07fbac28a61d698909d69724e853#subdirectory=mcp"
      - "blender-mcp"
    egress_hosts: [127.0.0.1]
    tool_denylist: [execute_blender_code, execute_blender_code_for_cli]
    metadata:
      admin_label: Blender (local stdio · uvx · experimental · sin ejecución de código)
      docs_url: https://www.blender.org/lab/mcp-server/
      repo_url: https://projects.blender.org/lab/blender_mcp
      install: uvx --from "git+https://projects.blender.org/lab/blender_mcp.git@v1.0.3#subdirectory=mcp" blender-mcp
      note: Requiere Blender 5.1+ abierto en este mismo equipo con el add-on de Blender Lab (repositorio https://lab.blender.org/). Es opt-in, no un conector por defecto.

  mcp_fetch:
    profile: stdio_npx_ro
    display_name: MCP Fetch (local stdio)
    launch_args: ["-y", "@modelcontextprotocol/server-fetch"]
    metadata:
      install: npx -y @modelcontextprotocol/server-fetch

  mcp_time:
    profile: stdio_npx_ro
    display_name: MCP Time (local stdio)
    launch_args: ["-y", "@modelcontextprotocol/server-time"]
    metadata:
      install: npx -y @modelcontextprotocol/server-time

  # Hugging Face Hub MCP oficial (remoto, https://huggingface.co/mcp). Busca modelos, datasets, Spaces, papers y documentación; sin sesión alcanza para buscar.
  # Solo lectura por allowlist (hf_fs solo ls/cat/stat/find/search): quedan fuera las tools dinámicas que ejecutan apps de Gradio de terceros. Los resultados son contenido de terceros (licencias propias
  # por repositorio): citar la licencia antes de reutilizar un modelo o dataset.
  huggingface:
    display_name: Hugging Face (Hub)
    transport: streamable_http
    endpoint_url: https://huggingface.co/mcp
    auth_kind: none
    read_only: true
    egress_hosts: [huggingface.co]
    tool_allowlist: [hub_repo_search, hub_repo_details, hf_fs, hf_whoami]  # the server's real tools (v0.4.31, verified by tools/list); all four are read-only
    metadata:
      admin_label: HTTP remoto · Hugging Face Hub (búsqueda, solo lectura)
      docs_url: https://huggingface.co/docs/hub/en/hf-mcp-server
      note: Opt-in. Solo hub_repo_search, hub_repo_details, hf_fs y hf_whoami (lectura); no concede las apps de Gradio.

  # Papers with Code (reimplementación de Hugging Face tras el retiro del sitio original; https://paperswithcode.co/mcp, Streamable HTTP, anónimo y de solo lectura).
  # Papers, código oficial, tareas, métodos, conferencias, organizaciones y leaderboards. Las 20 tools son de consulta (tools/list del 27-oct-2026; llms.txt del sitio
  # nombra otras, p. ej. search_papers, que no existe: se busca con list_papers). Beta sin releases: la lista puede cambiar, repetir tools/list al actualizar.
  # El texto de los papers (read_paper) es contenido de terceros no confiable: puede traer instrucciones inyectadas; no concederlo junto a herramientas de ejecución u órdenes.
  paperswithcode:
    display_name: Papers with Code
    transport: streamable_http
    endpoint_url: https://paperswithcode.co/mcp
    auth_kind: none
    read_only: true
    egress_hosts: [paperswithcode.co]
    tool_allowlist: [get_paper_info, get_paper_evaluations, read_paper, list_papers, list_recent_papers, list_trending_papers, get_related_papers, get_paper_lineage, get_task, list_tasks, get_method, list_methods, get_conference, list_conferences, get_organization, list_organizations, get_framework, list_frameworks, get_benchmark, list_benchmarks]
    metadata:
      admin_label: HTTP remoto · Papers with Code (papers, código y leaderboards, solo lectura)
      docs_url: https://github.com/huggingface/paperswithcode
      note: Opt-in. Límite del sitio 120 solicitudes/min por IP (beta, sin garantía). Las 20 tools verificadas por tools/list; read_paper devuelve texto de terceros.

  # OpenBB MCP oficial (openbb-mcp-server, del propio repo OpenBB, Apache-2.0), por stdio con uvx. Datos de mercado: yfinance (52 tools, sin clave), SEC (27),
  # equity (30), ETF, economía y 59 indicadores técnicos; 178 tools en total, TODAS de lectura. Versiones FIJAS (verificado con tools/list el 27-oct-2026).
  # `--tool-discovery` oculta el catálogo tras 4 tools de descubrimiento + run_pipeline: ahorra decenas de miles de tokens por llamada frente a las 178.
  # install_skill (escribe archivos en el host) y los tools de prompts/recursos quedan fuera. Los datos «no son necesariamente exactos» (OpenBB): no usar para
  # órdenes. openbb-yfinance es AGPL-3.0: se ejecuta como proceso aparte, no se empaqueta ni se distribuye con DuckClaw. Datos de Yahoo: uso personal.
  openbb:
    profile: stdio_uvx_ro
    display_name: OpenBB (datos de mercado)
    launch_args: ["--from", "openbb-mcp-server==2.0.1", "--with", "openbb-equity==2.0.0", "--with", "openbb-economy==2.0.0", "--with", "openbb-etf==2.0.0",
                  "--with", "openbb-yfinance==2.0.0", "--with", "openbb-sec==2.0.0", "openbb-mcp", "--transport", "stdio", "--tool-discovery"]
    tool_allowlist: [available_categories, available_tools, search_tools, call_tool, run_pipeline]
    metadata:
      install: uvx --from openbb-mcp-server==2.0.1 --with openbb-equity==2.0.0 --with openbb-economy==2.0.0 --with openbb-etf==2.0.0 --with openbb-yfinance==2.0.0 --with openbb-sec==2.0.0 openbb-mcp --transport stdio --tool-discovery
      admin_label: OpenBB · datos de mercado (local stdio · uvx · solo lectura · versión fija)
      docs_url: https://github.com/OpenBB-finance/OpenBB/tree/develop/openbb_platform/extensions/mcp_server
      note: Opt-in. Primer arranque lento (descarga las dependencias de OpenBB). Sin claves usa yfinance y SEC; otros proveedores piden su clave en ~/.openbb_platform/user_settings.json.

  # Tailscale no publica un MCP oficial y no se usa el de la comunidad: el skill `tailscale` (forge/skills/tailscale_bridge.py) consulta la API oficial
  # (solo lectura, host fijo api.tailscale.com) con la clave de Integraciones → Infraestructura, sin código de terceros que reciba la clave.

  # Playwright MCP oficial (Microsoft, Apache-2.0). Versión FIJA a propósito (0.0.x publica a menudo): subir a mano.
  # Controla un navegador real: abre páginas, hace clic, escribe y lee el DOM, así que NO es de solo lectura. Corre sin ventana y
  # con perfil aislado (sin cookies ni sesiones del usuario). Usa el Chromium que instala Playwright (sin él busca Google Chrome del sistema):
  # npx playwright install chromium. Si el proceso corre como root hay que añadir --no-sandbox en ESE despliegue, no aquí.
  # Una página puede llevar instrucciones inyectadas: no concederlo a workers con herramientas de ejecución de órdenes.
  playwright:
    profile: stdio_npx_rw
    display_name: Playwright (navegador)
    launch_args: ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated", "--browser", "chromium"]
    # JS arbitrario en la página, código de Playwright sin sandbox y lectura de archivos locales: fuera salvo decisión explícita.
    tool_denylist: [browser_run_code_unsafe, browser_evaluate, browser_file_upload]
    metadata:
      install: npx -y @playwright/mcp@0.0.83 --headless --isolated --browser chromium
      admin_label: Playwright · navegador sin ventana y aislado (local stdio, versión fija)
      docs_url: https://github.com/microsoft/playwright-mcp
      note: Requiere Node y los navegadores de Playwright instalados en el host (npx playwright install chromium). Opt-in, no por defecto.

  # Spotify playback MCP (stdio). Auth = host ~/.spotify-mcp/config.json + `npx … auth`.
  # Package: @0xbarandiaran/spotify-mcp-server (npm; Feb 2026 API). Not @marcelmarais/… (404).
  spotify:
    profile: stdio_npx_rw
    display_name: Spotify
    launch_args: ["-y", "@0xbarandiaran/spotify-mcp-server"]
    metadata:
      install: npx -y @0xbarandiaran/spotify-mcp-server
      oauth_pkce: true
      manifest_skill_id: spotify
      admin_label: Spotify playback (local stdio · OAuth Admin)
      docs_url: https://www.npmjs.com/package/@0xbarandiaran/spotify-mcp-server
      # OAuth Admin escribe ~/.spotify-mcp/config.json (SPOTIFY_CLIENT_ID/SECRET en Gateway).

  # ═══════════════════════════════════════════
  # Infra / Cloud
  # ═══════════════════════════════════════════

  terraform:
    profile: stdio_npx_rw
    display_name: Terraform
    launch_args: ["-y", "mcp-server-terraform"]
    metadata:
      install: npx -y mcp-server-terraform
      manifest_skill_id: terraform
      admin_label: Terraform IaC (local stdio)
      docs_url: https://www.npmjs.com/package/mcp-server-terraform

  aws:
    profile: stdio_npx_rw
    display_name: AWS
    launch_args: ["-y", "@yawlabs/aws-mcp"]
    metadata:
      install: npx -y @yawlabs/aws-mcp
      manifest_skill_id: aws
      admin_label: AWS (local stdio, SSO-ready)
      docs_url: https://www.npmjs.com/package/@yawlabs/aws-mcp
      # Soporta AWS SSO + IAM Identity Center. Describe EC2, lista S3, sugiere hardening IAM.

  kubernetes_lens:
    profile: stdio_npx_rw
    display_name: Kubernetes Lens
    launch_args: ["-y", "lens-mcp-server"]
    metadata:
      install: npx -y lens-mcp-server
      manifest_skill_id: kubernetes
      admin_label: Kubernetes Lens (local stdio)
      docs_url: https://www.npmjs.com/package/lens-mcp-server
      # Integración con AWS EKS y Azure AKS directa.

  # ═══════════════════════════════════════════
  # Observabilidad / Incident Management
  # ═══════════════════════════════════════════

  datadog:
    transport: stdio
    launch_command: npx
    launch_args: ["-y", "@winor30/mcp-server-datadog"]
    display_name: Datadog
    auth_kind: bearer
    read_only: false
    metadata:
      install: npx -y @winor30/mcp-server-datadog
      oauth_pkce: false
      manifest_skill_id: datadog
      admin_label: Datadog · Bearer (API + App key)
      docs_url: https://www.npmjs.com/package/@winor30/mcp-server-datadog
      env_vars: [DATADOG_API_KEY, DATADOG_APP_KEY, DATADOG_SITE]

  pagerduty:
    transport: stdio
    launch_command: npx
    launch_args: ["-y", "@aparkerio/pagerduty-mcp-server"]
    display_name: PagerDuty
    auth_kind: bearer
    read_only: false
    metadata:
      install: npx -y @aparkerio/pagerduty-mcp-server
      oauth_pkce: false
      manifest_skill_id: pagerduty
      admin_label: PagerDuty Incidentes · Bearer (API key)
      docs_url: https://www.npmjs.com/package/@aparkerio/pagerduty-mcp-server
      env_vars: [PAGERDUTY_API_KEY]
      # Hasta 30% reducción en MTTR según benchmarks.

  # ═══════════════════════════════════════════
  # Ofimática / Productividad
  # ═══════════════════════════════════════════

  microsoft_365:
    transport: stdio
    launch_command: npx
    launch_args: ["-y", "@softeria/ms-365-mcp-server"]
    display_name: Microsoft 365 (Graph API)
    auth_kind: bearer
    read_only: false
    metadata:
      install: npx -y @softeria/ms-365-mcp-server
      oauth_pkce: false
      manifest_skill_id: microsoft_365
      admin_label: Microsoft 365 Graph API · Bearer (token Entra ID)
      docs_url: https://www.npmjs.com/package/@softeria/ms-365-mcp-server
      env_vars: [M365_CLIENT_ID, M365_CLIENT_SECRET, M365_TENANT_ID]


  excel:
    profile: stdio_uvx_rw
    display_name: Excel (haris-musa)
    launch_args: ["excel-mcp-server"]
    metadata:
      install: uvx excel-mcp-server
      manifest_skill_id: excel
      admin_label: Excel local (uvx, haris-musa)
      docs_url: https://github.com/haris-musa/excel-mcp-server

  adeu_docx:
    profile: stdio_npx_rw
    display_name: Adeu DOCX
    launch_args: ["-y", "@adeu/mcp-server"]
    metadata:
      install: npx -y @adeu/mcp-server
      manifest_skill_id: adeu
      admin_label: Adeu redlining DOCX (local stdio)
      docs_url: https://github.com/dealfluence/adeu
      # Edición con track changes, diff y sanitización de documentos Word .docx.

  # ═══════════════════════════════════════════
  # Bases de Datos
  # ═══════════════════════════════════════════

  google_db_toolbox:
    profile: stdio_uvx_rw
    display_name: Google MCP Toolbox for Databases
    launch_args: ["mcp-toolbox-database"]
    metadata:
      install: uvx mcp-toolbox-database
      manifest_skill_id: google_db
      admin_label: Google DB Toolbox multi-DB (uvx)
      docs_url: https://github.com/google/mcp-toolbox-database
      # Postgres, MySQL, SQL Server, BigQuery, Spanner, AlloyDB y más.

  postgres:
    profile: stdio_npx_rw
    display_name: PostgreSQL
    launch_args: ["-y", "postgres-mcp-server"]
    metadata:
      install: npx -y postgres-mcp-server
      manifest_skill_id: postgres
      admin_label: PostgreSQL (local stdio, requiere connection string)
      docs_url: https://www.npmjs.com/package/postgres-mcp-server
      # Requiere DATABASE_URL gestionado como secreto de plataforma (postgresql://...).
      secret_env: [DATABASE_URL]

  neon:
    transport: stdio
    launch_command: uvx
    launch_args: ["neon-mcp-server"]
    display_name: Neon (serverless Postgres)
    auth_kind: bearer
    read_only: false
    metadata:
      install: uvx neon-mcp-server
      oauth_pkce: false
      manifest_skill_id: neon
      admin_label: Neon Serverless Postgres · Bearer (API key)
      docs_url: https://neon.tech/docs/ai/mcp-server
      env_vars: [NEON_API_KEY]

  pg_edge_postgres:
    profile: stdio_uvx_rw
    display_name: pgEdge Postgres
    launch_args: ["pgedge-mcp"]
    metadata:
      install: uvx pgedge-mcp
      manifest_skill_id: pg_edge
      admin_label: pgEdge Postgres distribuido (uvx)
